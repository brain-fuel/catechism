changes:
  - source_id: scripture-layer-global
    before: Holy Spirit
    after: Holy Ghost
    category: terminology concordance
    reason: Required edition-wide title for the Third Person.
    evidence: Historic English Svebilius usage and editorial policy.
  - source_id: scripture-ot-global
    before: LORD/GOD/JEHOVAH at H3068/H3069 loci
    after: Yahweh
    category: Divine Name concordance
    reason: Restore the Hebrew proper name in the reading layer.
    evidence: Westminster Hebrew morphology at pinned source commit.
  - source_id: catechism-commandment-formulas
    before: Lord thy God / the Lord will not hold him guiltless
    after: Yahweh thy God / Yahweh will not hold him guiltless
    category: Divine Name concordance
    reason: The catechism quotes the Decalogue at Hebrew H3068 loci.
    evidence: Exodus 20:2,7 and Deuteronomy 5:6,11 in the pinned Hebrew dataset.
  - source_id: catechism-decalogue-reading-text
    before: Historic paraphrased English commandment formulas.
    after: KJV wording of Exodus 20, with Yahweh at H3068 loci and the Lutheran division of the Ninth and Tenth Commandments retained.
    category: Scripture reading-text concordance
    reason: Use the KJV as the default English wording wherever the Commandments themselves are printed.
    evidence: Exodus 20:2-17 in the vendored KJV and Hebrew datasets.
  - source_id: scripture-nt-deuteronomy-quotations
    before: Lord thy God
    after: Yahweh thy God
    category: Divine Name concordance
    reason: Restore the Divine Name in direct New Testament quotations of Deuteronomy.
    evidence: Manually approved Matthew 4:7, Matthew 22:37, and Luke 10:27 registry entries.
  - source_id: scripture-hebrew-hallelu-yah
    before: Praise ye Yahweh / Alleluia
    after: Hallelujah
    category: Hebrew liturgical transliteration
    reason: Preserve the Hebrew acclamation as a single transliterated liturgical word rather than the KJV paraphrase.
    evidence: Hebrew הללויה, Strong’s H1984 and H3050 in the pinned Hebrew dataset.
  - source_id: svebilius-en-q007
    before: "For this reason, that he who would be saved may not trust in the faith of others, but must have for himself a right Christian faith"
    after: "Because whoever would be saved must not trust in the faith of others, but must himself have a true Christian faith"
    category: obvious English correction
    reason: Correct the awkward English syntax and replace ambiguous “may not” with the obligation expressed by the Finnish witness.
    evidence: "Finnish: ettei se, joka tahtoo autuaaksi tulla, saa luottaa muitten uskoon, vaan hänelle pitää itsellensä oleman oikea kristillinen usko."
