policy:
  purpose: Pair one documented story with one historic sacred artwork in every unit.
  selection: Prefer African, Middle Eastern, and early Christian witnesses; use European works only where a clear licensed witness was not available in the preferred traditions.
  accepted_licenses: [Public Domain, CC0 1.0]
  reviewed: true

collections:
  armenian_w540:
    description: Armenian Gospel made near Lake Van in 1475; manuscript images digitized by the Walters Art Museum.
    source: https://commons.wikimedia.org/wiki/Category:Walters_MS_W540_-_Armenian_Gospels_of_1475
    license: CC0 1.0
  armenian_w543:
    description: Armenian Gospel made at Xizan in 1455, written by Yohannēs Vardapet and illuminated by the priest Xačʿatur.
    source: https://commons.wikimedia.org/wiki/Category:Walters_MS_W543_-_Gospel
    license: CC0 1.0
  walters_ethiopian:
    description: Ethiopian Christian manuscripts and church paintings digitized by the Walters Art Museum.
    source: https://commons.wikimedia.org/wiki/Category:Christian_art_of_Ethiopia_in_the_Walters_Art_Museum
    license: Public Domain

